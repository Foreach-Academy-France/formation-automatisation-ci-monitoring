name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Slides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Marp CLI
        run: bun add -g @marp-team/marp-cli

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended fonts-noto-color-emoji

      - name: Create output directories
        run: |
          mkdir -p public/slides
          mkdir -p public/pdf
          mkdir -p public/tp-pdf

      - name: Build HTML slides
        run: |
          for slide in slides/*.md; do
            echo "Building $(basename $slide)..."
            marp "$slide" --html --allow-local-files -o "public/slides/$(basename $slide .md).html"
          done

      - name: Build PDF slides
        run: |
          for slide in slides/*.md; do
            echo "Building PDF for $(basename $slide)..."
            marp "$slide" --html --allow-local-files --pdf -o "public/pdf/$(basename $slide .md).pdf"
          done

      - name: Build TP PDFs
        run: |
          # Un PDF par énoncé de TP (fil rouge) + les READMEs TP
          for tp in tp/fil-rouge-taskflow/jour*.md tp/fil-rouge-taskflow/README.md tp/README.md; do
            [ -f "$tp" ] || continue
            name=$(basename "$tp" .md)
            case "$tp" in
              tp/README.md) name="tp-overview" ;;
              tp/fil-rouge-taskflow/README.md) name="fil-rouge-taskflow" ;;
            esac
            echo "Generating PDF for $tp -> $name.pdf ..."
            pandoc "$tp" \
              -o "public/tp-pdf/${name}.pdf" \
              --pdf-engine=xelatex \
              -V geometry:margin=2cm \
              -V documentclass=article \
              -V fontsize=11pt \
              -V mainfont="DejaVu Sans" \
              -V monofont="DejaVu Sans Mono" \
              -V colorlinks=true \
              --toc \
              --highlight-style=tango || echo "::warning::PDF failed for $tp"
          done

      - name: Copy additional files
        run: |
          # NB : evaluation/qcm-corrige.md est gitignoré → absent du checkout → jamais publié
          [ -d tp ] && cp -r tp public/
          [ -d evaluation ] && cp -r evaluation public/
          [ -d ressources ] && cp -r ressources public/
          [ -d demos ] && cp -r demos public/
          cp README.md plan-cours.md public/

