# =============================================================================
# alertmanager.yml — routage et notification des alertes TaskFlow
# =============================================================================
# Politique :
#   - tout part par mail (MailHog : http://localhost:8025) → receiver `mail`
#   - severity=critical part EN PLUS sur Discord → receiver `discord`
#   - une alerte critical inhibe les warnings de la même cible (moins de bruit)
#   - Watchdog est routée vers le receiver `blackhole` (rien à notifier)
#
# Validation : amtool check-config alertmanager.yml   (job lint-monitoring du CI)
# Ce fichier est le MODÈLE versionné. Le fichier réel contient votre webhook :
#   cp alertmanager.example.yml alertmanager.yml   (alertmanager.yml est gitignoré)
# ⚠️ Remplacez CHANGE_ME par votre webhook Discord (ou passez sur slack_configs).
# =============================================================================
global:
  resolve_timeout: 5m
  smtp_smarthost: 'mailhog:1025'
  smtp_from: 'alertmanager@taskflow.local'
  smtp_require_tls: false

route:
  receiver: mail                       # receiver par défaut
  group_by: ['alertname', 'env']       # 1 notification par (alerte, environnement)
  group_wait: 30s                      # attendre 30 s pour regrouper les alertes qui arrivent ensemble
  group_interval: 5m                   # nouvelles alertes dans un groupe existant : toutes les 5 min
  repeat_interval: 4h                  # re-notifier une alerte toujours active toutes les 4 h
  routes:
    # Le Watchdog n'est pas une alerte : on l'absorbe
    - matchers:
        - alertname = Watchdog
      receiver: blackhole

    # Les alertes critiques partent aussi sur Discord (continue: true → on
    # continue l'évaluation, donc le mail par défaut est aussi envoyé)
    - matchers:
        - severity = critical
      receiver: discord
      continue: true
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: blackhole

  - name: mail
    email_configs:
      - to: 'ops@taskflow.local'
        send_resolved: true

  - name: discord
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/CHANGE_ME'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.env }}) — {{ .Status | toUpper }}'
        message: '{{ range .Alerts }}• {{ .Annotations.summary }}{{ "\n" }}{{ end }}'

  # Alternative Slack (webhook entrant) :
  # - name: slack
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/CHANGE_ME'
  #       channel: '#alertes-taskflow'
  #       send_resolved: true
  #       title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.env }})'
  #       text: '{{ range .Alerts }}• {{ .Annotations.summary }}\n{{ end }}'

# Une alerte critical sur une instance masque les warnings de la même instance :
# si l'API est down, inutile de recevoir aussi "latence élevée".
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['env']
