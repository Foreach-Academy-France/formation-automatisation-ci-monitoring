---
node_exporter_version: "1.8.2"
node_exporter_port: 9100
node_exporter_user: node_exporter
node_exporter_bin: /usr/local/bin/node_exporter
# Correspondance architecture Ansible → nom d'archive GitHub
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] | default('amd64') }}"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}.tar.gz"
