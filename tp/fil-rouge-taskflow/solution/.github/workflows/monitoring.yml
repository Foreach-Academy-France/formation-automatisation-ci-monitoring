# =============================================================================
# monitoring.yml — déploie les agents de monitoring (node_exporter) sur les VMs
# =============================================================================
# Déclenché :
#   - manuellement (workflow_dispatch)
#   - automatiquement quand le rôle node_exporter ou son playbook change
#
# Comme deploy.yml, ce job tourne sur le runner self-hosted (accès aux VMs).
# Il cible TOUS les hôtes (staging + prod) : le monitoring n'a pas de promotion.
# =============================================================================
name: Monitoring agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ansible/roles/node_exporter/**'
      - 'ansible/playbooks/monitoring.yml'
      - '.github/workflows/monitoring.yml'

concurrency:
  group: deploy                 # même groupe que Deploy : pas d'Ansible concurrent sur les VMs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node-exporter:
    name: 📡 Déployer node_exporter
    runs-on: [self-hosted, lab]
    timeout-minutes: 10
    environment: staging        # réutilise SSH_PRIVATE_KEY de l'environment staging
    env:
      ANSIBLE_HOST_KEY_CHECKING: 'False'
      ANSIBLE_FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: ⚙️ ansible-playbook monitoring.yml
        run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/monitoring.yml

      - name: 📋 Résumé
        run: |
          {
            echo "## 📡 node_exporter déployé"
            echo ""
            echo "Prometheus peut maintenant scraper \`<ip_vm>:9100/metrics\` (job \`node-vms\`)."
          } >> "$GITHUB_STEP_SUMMARY"
