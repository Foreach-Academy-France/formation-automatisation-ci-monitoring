# =============================================================================
# reusable-node-ci.yml — workflow RÉUTILISABLE de CI pour un projet Node
# =============================================================================
# `on: workflow_call` : ce workflow ne se déclenche jamais seul. Il est appelé
# par un autre workflow avec `jobs.<id>.uses: ./.github/workflows/reusable-node-ci.yml`.
#
# Il est appelé DEUX fois par ci.yml : pour le front (.) et pour l'API (api/).
# Même logique, même qualité, zéro copier-coller.
#
# Étapes : lint → tests (rapport JUnit publié + couverture résumée) → build.
# =============================================================================
name: Reusable Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Dossier du projet Node (contient package.json)
        required: true
        type: string
      node-version:
        description: Version de Node.js
        required: false
        type: string
        default: '20'
      upload-artifact:
        description: Publier dist/ comme artefact après le build
        required: false
        type: boolean
        default: false
      artifact-name:
        description: Nom logique du projet (utilisé pour nommer rapports et artefacts)
        required: false
        type: string
        default: app
      coverage-threshold:
        description: Couverture minimale (lignes, en %) sous laquelle le job échoue
        required: false
        type: number
        default: 70

# Permissions minimales : `checks: write` est nécessaire à dorny/test-reporter
# pour publier le rapport de tests comme "check" sur le commit / la PR.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint (${{ inputs.artifact-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node + dépendances
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      - name: 🔍 ESLint
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint

      - name: 🎨 Prettier (si le script existe)
        working-directory: ${{ inputs.working-directory }}
        run: npm run format:check --if-present

  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests (${{ inputs.artifact-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node + dépendances
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      - name: 🧪 Tests + rapport JUnit + couverture
        working-directory: ${{ inputs.working-directory }}
        run: npm run test:ci

      # Publie reports/junit.xml comme "check" lisible dans l'onglet Checks de la PR.
      # `if: always()` : on veut le rapport MÊME si les tests ont échoué.
      - name: 📋 Publication du rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      # Résumé de couverture calculé depuis lcov.info :
      #   LF = lignes trouvées, LH = lignes couvertes (par fichier) → on somme.
      - name: 📊 Résumé de couverture
        if: always()
        working-directory: ${{ inputs.working-directory }}
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::Pas de coverage/lcov.info"; exit 0
          fi
          LF=$(grep -h '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          LH=$(grep -h '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN { if (lf == 0) print 0; else printf "%.1f", lh * 100 / lf }')
          {
            echo "## 📊 Couverture — ${{ inputs.artifact-name }}"
            echo ""
            echo "| Lignes couvertes | Lignes totales | Couverture | Seuil |"
            echo "|---|---|---|---|"
            echo "| $LH | $LF | **${PCT} %** | ${THRESHOLD} % |"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN { exit !(p < t) }'; then
            echo "::error::Couverture ${PCT} % < seuil ${THRESHOLD} %"
            exit 1
          fi

      - name: 📦 Artefact de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build (${{ inputs.artifact-name }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node + dépendances
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      # --if-present : l'API n'a pas de script build (pas de transpilation)
      - name: 🔨 Build
        working-directory: ${{ inputs.working-directory }}
        run: npm run build --if-present

      - name: 📦 Artefact de build
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7
