# =============================================================================
# TaskFlow - Workflow CI (hérité du cours "Initialisation CI")
# =============================================================================
# Point de départ du Jour 1. Ce workflow ne teste que le FRONT.
#
# TODO J1 (TP1) :
#   - étape 1 : hello-runner.yml → premier job sur le runner self-hosted
#   - étape 2 : .github/actions/setup-node-project/action.yml (action composite)
#   - étape 3 : .github/workflows/reusable-node-ci.yml (workflow_call) et
#               remplacer les jobs ci-dessous par deux appels `uses:` (front + api)
#   - étape 4 : concurrency, paths-ignore, rapport JUnit, résumé de couverture
# TODO J4 : job lint-monitoring (promtool / amtool)
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: 🧪 Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - name: 📊 Upload du rapport de couverture
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
