# Datasources Grafana provisionnées au démarrage (monitoring as code)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s          # aligné sur scrape_interval

  # Bonus J4 : décommenter avec les services loki/promtail du compose
  # - name: Loki
  #   uid: loki
  #   type: loki
  #   access: proxy
  #   url: http://loki:3100
  #   editable: false
