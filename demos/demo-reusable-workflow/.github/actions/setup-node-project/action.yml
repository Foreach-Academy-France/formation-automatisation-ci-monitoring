name: Setup Node project
description: setup-node + cache + npm ci
inputs:
  working-directory: { default: '.' }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: '20', cache: npm, cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json' }
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
